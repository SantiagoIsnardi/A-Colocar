name: Sofascore Sync

# Corre aislado de Render: usa el runner de GitHub (Ubuntu, ~7GB RAM)
# en vez de compartir memoria con el Web Service del backend. Escribe
# directo a Neon usando DATABASE_URL como secret del repo.

on:
  schedule:
    # 09:00 UTC — después de sync_football_data_statuses (06:00) y
    # resolve_predictions (07:00) del scheduler interno de Render.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      max_matches:
        description: "Límite de partidos a procesar por competencia (vacío = sin límite)"
        required: false
        default: "20"

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false -> si una competencia falla (ej. temporada mal
      # configurada), las demás igual corren. Cada una queda como un
      # check separado en la pestaña Actions, fácil de ver cuál rompió.
      fail-fast: false
      matrix:
        include:
          # ─── Local ──────────────────────────────────────────────
          - nombre: "Argentina - Liga Profesional"
            league: "Argentina Liga Profesional"
            season: "2026" # temporada anual, formato calendario

          # ─── 5 grandes ligas europeas ──────────────────────────
          # OJO: estas 5 usan temporada partida (ej. "25/26"). El
          # formato EXACTO del string depende de lo que devuelva
          # get_valid_seasons() — confirmalo una vez antes del primer
          # run real (ver instrucciones abajo) y reemplazá el valor.
          - nombre: "Inglaterra - Premier League"
            league: "England Premier League"
            season: "<COMPLETAR>"
          - nombre: "España - La Liga"
            league: "Spain La Liga"
            season: "<COMPLETAR>"
          - nombre: "Italia - Serie A"
            league: "Italy Serie A"
            season: "<COMPLETAR>"
          - nombre: "Alemania - Bundesliga"
            league: "Germany Bundesliga"
            season: "<COMPLETAR>"
          - nombre: "Francia - Ligue 1"
            league: "France Ligue 1"
            season: "<COMPLETAR>"

          # ─── Competencias internacionales ──────────────────────
          - nombre: "UEFA - Champions League"
            league: "UEFA Champions League"
            season: "<COMPLETAR>" # también temporada partida
          - nombre: "CONMEBOL - Copa Libertadores"
            league: "CONMEBOL Copa Libertadores"
            season: "2026" # temporada anual
          - nombre: "FIFA - Mundial"
            league: "FIFA World Cup"
            season: "2026" # Mundial 2026 (USA/México/Canadá)

          # Mundial de Clubes: NO incluido todavía. ScraperFC 4.5.0 no
          # tiene esa competencia mapeada a un ID de Sofascore (no está
          # en su comps.yaml). Si una versión más nueva la agrega, se
          # suma acá como una entrada más.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-sofascore.txt

      - name: Sync ${{ matrix.nombre }}
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m app.cli.seed_sofascore_upcoming \
            "${{ matrix.league }}" \
            "${{ matrix.season }}" \
            "${{ github.event.inputs.max_matches || '20' }}"